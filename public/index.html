<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Creep Colony - Expand and Conquer</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #1a1a2e;
            color: #eee;
            font-family: 'Courier New', monospace;
        }
        #app {
            max-width: 1200px;
            margin: 0 auto;
        }
        .game-title {
            text-align: center;
            color: #9d4edd;
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 0 0 10px #9d4edd;
        }
        .game-info {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
            padding: 15px;
            background: #16213e;
            border-radius: 8px;
            border: 2px solid #9d4edd;
        }
        .stat {
            text-align: center;
        }
        .stat-value {
            font-size: 1.8em;
            color: #7b2cbf;
            font-weight: bold;
        }
        .stat-label {
            color: #aaa;
            font-size: 0.9em;
        }
        .game-grid {
            display: inline-grid;
            gap: 1px;
            background: #0f0f1e;
            padding: 10px;
            border-radius: 8px;
            border: 3px solid #9d4edd;
            box-shadow: 0 0 20px rgba(157, 78, 221, 0.3);
        }
        .grid-cell {
            width: 14px;
            height: 14px;
            border: 1px solid #2a2a3e;
            cursor: pointer;
            transition: all 0.2s;
        }
        .grid-cell:hover {
            transform: scale(1.2);
            z-index: 10;
        }
        .empty {
            background: #1a1a2e;
        }
        .creep {
            background: #7b2cbf;
            box-shadow: 0 0 3px #9d4edd;
        }
        .colony {
            background: #c77dff;
            border-radius: 50%;
            box-shadow: 0 0 8px #e0aaff;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 8px #e0aaff; }
            50% { box-shadow: 0 0 15px #e0aaff; }
        }
        .instructions {
            margin-top: 20px;
            padding: 15px;
            background: #16213e;
            border-radius: 8px;
            border-left: 4px solid #9d4edd;
        }
        .instructions h3 {
            margin-top: 0;
            color: #9d4edd;
        }
        button {
            background: #7b2cbf;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1.1em;
            border-radius: 5px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            margin: 10px 5px;
            transition: all 0.3s;
        }
        button:hover {
            background: #9d4edd;
            box-shadow: 0 0 10px #9d4edd;
        }
        button:disabled {
            background: #444;
            cursor: not-allowed;
            box-shadow: none;
        }
        .victory {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #16213e;
            padding: 40px;
            border-radius: 15px;
            border: 4px solid #9d4edd;
            box-shadow: 0 0 50px rgba(157, 78, 221, 0.5);
            text-align: center;
            z-index: 1000;
        }
        .victory h2 {
            color: #9d4edd;
            font-size: 3em;
            margin: 0 0 20px 0;
            animation: victory-pulse 1s infinite;
        }
        @keyframes victory-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
    </style>
</head>
<body>
    <div id="app"></div>
    <script src="js/main.js"></script>
</body>
</html>
