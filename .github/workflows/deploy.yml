name: Deploy to GitHub Pages

on:
  push:
    branches: [ claude/creep-colony-game-KJ5Py ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Clojure dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            .cpcache
            .shadow-cljs
          key: ${{ runner.os }}-clj-${{ hashFiles('**/deps.edn', '**/shadow-cljs.edn') }}
          restore-keys: |
            ${{ runner.os }}-clj-

      - name: Install npm dependencies
        run: npm ci

      - name: Build ClojureScript
        run: npm run build

      - name: List public directory
        run: ls -la public/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
